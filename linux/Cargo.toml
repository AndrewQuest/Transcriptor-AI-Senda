[package]
name = "senda-linux"
version = "0.3.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.10" }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
futures-util = "0.3"
zbus = "5"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
